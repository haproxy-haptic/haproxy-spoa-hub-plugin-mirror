name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  # The workflow name keeps a release.yml call from cancelling, or being cancelled by, CI on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=docker depName=rust
  RUST_VERSION: "1.94"
  # renovate: datasource=crate depName=cargo-auditable
  CARGO_AUDITABLE_VERSION: "0.7.4"
  CARGO_INCREMENTAL: "0"
  GLIBC_VERSION: "2.36"
  LIB_NAME: libmirror_plugin
  HUB_TAG: latest

jobs:
  # `container:` cannot read `env`, so the Rust pin reaches the jobs through this output.
  pins:
    runs-on: ubuntu-24.04
    outputs:
      rust-image: rust:${{ env.RUST_VERSION }}-bookworm
    steps:
      - run: "true"

  fmt:
    needs: pins
    runs-on: ubuntu-24.04
    container: ${{ needs.pins.outputs.rust-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt
      - run: cargo fmt -- --check

  clippy:
    needs: pins
    runs-on: ubuntu-24.04
    container: ${{ needs.pins.outputs.rust-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add clippy
      - run: cargo clippy --workspace -- -D warnings

  test:
    needs: pins
    runs-on: ubuntu-24.04
    container: ${{ needs.pins.outputs.rust-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --workspace

  bench:
    needs: pins
    runs-on: ubuntu-24.04
    container: ${{ needs.pins.outputs.rust-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo bench 2>&1 | tee bench-output.txt
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: |
            bench-output.txt
            target/criterion/
          retention-days: 7

  build:
    needs: pins
    runs-on: ubuntu-24.04
    container: ${{ needs.pins.outputs.rust-image }}
    strategy:
      matrix:
        include:
          - arch: amd64
            rust-target: x86_64-unknown-linux-gnu
          - arch: arm64
            rust-target: aarch64-unknown-linux-gnu
            cross-pkg: gcc-aarch64-linux-gnu
            cross-linker: aarch64-linux-gnu-gcc
          - arch: armv7
            rust-target: armv7-unknown-linux-gnueabihf
            cross-pkg: gcc-arm-linux-gnueabihf
            cross-linker: arm-linux-gnueabihf-gcc
    env:
      ARCH: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.rust-target }}
      CROSS_PKG: ${{ matrix.cross-pkg }}
      CROSS_LINKER: ${{ matrix.cross-linker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the cross toolchain
        run: |
          rustup target add "${RUST_TARGET}"
          if [ -n "${CROSS_PKG}" ]; then
            apt-get update -qq && apt-get install -y -qq "${CROSS_PKG}" >/dev/null
            mkdir -p .cargo
            printf '[target.%s]\nlinker = "%s"\n' "${RUST_TARGET}" "${CROSS_LINKER}" > .cargo/config.toml
          fi
      # cargo-auditable embeds the dependency list so syft and grype can scan the published .so.
      - run: cargo install --locked "cargo-auditable@${CARGO_AUDITABLE_VERSION}"
      - run: cargo auditable build --release --target "${RUST_TARGET}"
      - name: Stage the artifact
        run: |
          FILE="${LIB_NAME}-${ARCH}-glibc${GLIBC_VERSION}.so"
          mkdir -p artifacts
          cp "target/${RUST_TARGET}/release/${LIB_NAME}.so" "artifacts/${FILE}"
          (cd artifacts && sha256sum "${FILE}" > "${FILE}.sha256")
          ls -lh artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.arch }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

  # Loads the .so into the hub image; arm64 and armv7 run under QEMU.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        arch: [amd64, arm64, armv7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.arch }}
          path: artifacts
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64,arm
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: tests/smoke/run.sh --arch "${ARCH}"
        timeout-minutes: 10
        env:
          ARCH: ${{ matrix.arch }}
